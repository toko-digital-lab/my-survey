<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アンケート管理画面（Editor）</title>
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 20px auto; padding: 20px; }
    textarea { width: 100%; height: 400px; font-family: monospace; padding: 10px; margin-bottom: 20px; }
    button { padding: 10px 20px; font-size: 16px; cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 4px; }
    button:hover { background-color: #0056b3; }
  </style>
</head>
<body>

  <h1>アンケート設問 編集エディタ</h1>
  <p>ここのJSONを書き換えて保存すると、アンケート画面が自動的に更新されます。</p>

  <!-- JSONを表示・編集するテキストエリア -->
  <textarea id="json-editor">読み込み中...</textarea>
  <br>
  
  <!-- 保存ボタン（※保存機能は次のステップで作ります！） -->
  <button onclick="saveJson()">GitHubへ保存して更新（未実装）</button>

  <script>
    // 画面が開いたときに、現在の form.json を読み込んでテキストエリアに入れる
    fetch('./form.json')
      .then(response => response.json())
      .then(data => {
        // JSONデータを綺麗な文字列にしてテキストエリアにセット
        document.getElementById('json-editor').value = JSON.stringify(data, null, 2);
      })
      .catch(error => {
        console.error('エラー:', error);
        document.getElementById('json-editor').value = '読み込みエラー';
      });

    // 保存ボタンを押したときの処理（今はまだアラートが出るだけです）
    function saveJson() {
      const updatedJson = document.getElementById('json-editor').value;
      console.log('保存するデータ:', updatedJson);
      alert('保存機能は次のステップで実装します！\\n\\n' + updatedJson);
    }
  </script>
</body>
</html>
